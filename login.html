<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Inicio de sesión — Plataforma Educativa de Lengua y Literatura 9.º Año EGB Superior. Acceso para docentes, estudiantes y administradores.">
    <meta name="author" content="Lengua &amp; Literatura 9no EGB - U.E.F. San Lorenzo">
    <title>Iniciar Sesión | Lengua y Literatura 9º EGB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/views/login.css">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <!-- Logo y Título -->
            <div class="logo-section">
                <span class="logo-icon-lg">📖</span>
                <h1>Lengua y Literatura <span style="color: var(--primary, #6366f1);">9ºEGB</span></h1>
                <p>U.E.F. San Lorenzo — Plataforma Educativa</p>
            </div>

            <!-- Mensaje de error -->
            <div class="login-error" id="login-error">
                <span>⚠️</span>
                <span id="login-error-text">Error de autenticación</span>
            </div>

            <!-- Formulario -->
            <form id="login-form" autocomplete="on">
                <div class="login-field">
                    <label for="login-email">Correo Electrónico</label>
                    <div class="input-icon-wrapper">
                        <input type="email" id="login-email" name="email"
                               placeholder="tu.nombre@sanlorenzo.edu.ec"
                               autocomplete="email" required>
                        <span class="field-icon">📧</span>
                    </div>
                </div>

                <div class="login-field">
                    <label for="login-password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="login-password" name="password"
                               placeholder="Ingresa tu contraseña"
                               autocomplete="current-password" required minlength="6">
                        <span class="field-icon">🔒</span>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span class="spinner"></span>
                    <span class="btn-text">🚀 Iniciar Sesión</span>
                </button>
            </form>

            <!-- Credenciales de Demo -->
            <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);">
                <p style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">🔑 Credenciales de prueba</p>
                <div style="display: grid; gap: 0.35rem; font-size: 0.78rem; color: rgba(255,255,255,0.55);">
                    <button type="button" class="demo-login-btn" data-email="admin@sanlorenzo.edu.ec" data-pass="Admin2026!"
                        style="background: none; border: none; color: rgba(255,255,255,0.55); text-align: left; cursor: pointer; padding: 0.25rem 0; font-size: 0.78rem; transition: color 0.2s;">
                        👨‍💼 Admin: admin@sanlorenzo.edu.ec / Admin2026!
                    </button>
                    <button type="button" class="demo-login-btn" data-email="maria.gonzalez@sanlorenzo.edu.ec" data-pass="Docente2026!"
                        style="background: none; border: none; color: rgba(255,255,255,0.55); text-align: left; cursor: pointer; padding: 0.25rem 0; font-size: 0.78rem; transition: color 0.2s;">
                        👩‍🏫 Docente: maria.gonzalez@sanlorenzo.edu.ec / Docente2026!
                    </button>
                    <button type="button" class="demo-login-btn" data-email="carlos.ramirez@sanlorenzo.edu.ec" data-pass="Est2026!"
                        style="background: none; border: none; color: rgba(255,255,255,0.55); text-align: left; cursor: pointer; padding: 0.25rem 0; font-size: 0.78rem; transition: color 0.2s;">
                        👨‍🎓 Estudiante: carlos.ramirez@sanlorenzo.edu.ec / Est2026!
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <a href="index.html">← Volver al Portal Público</a>
            </div>
        </div>
    </div>

    <script src="js/modules/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form       = document.getElementById('login-form');
            const btnLogin   = document.getElementById('btn-login');
            const errorBox   = document.getElementById('login-error');
            const errorText  = document.getElementById('login-error-text');
            const emailInput = document.getElementById('login-email');
            const passInput  = document.getElementById('login-password');

            // Ocultar error al escribir
            [emailInput, passInput].forEach(input => {
                input.addEventListener('input', () => {
                    errorBox.classList.remove('visible');
                });
            });

            // Submit del formulario
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email    = emailInput.value.trim();
                const password = passInput.value;

                if (!email || !password) {
                    showError('Por favor completa todos los campos.');
                    return;
                }

                // Estado de carga
                btnLogin.disabled = true;
                btnLogin.classList.add('loading');
                errorBox.classList.remove('visible');

                const result = await Auth.login(email, password);

                if (result.success) {
                    // Redirigir por rol
                    window.location.href = result.redirect;
                } else {
                    showError(result.error);
                    btnLogin.disabled = false;
                    btnLogin.classList.remove('loading');
                    passInput.value = '';
                    passInput.focus();
                }
            });

            // Botones de demo login
            document.querySelectorAll('.demo-login-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    emailInput.value = btn.getAttribute('data-email');
                    passInput.value  = btn.getAttribute('data-pass');
                    emailInput.focus();
                });
            });

            function showError(msg) {
                errorText.textContent = msg;
                errorBox.classList.add('visible');
            }

            // Si ya tiene sesión, redirigir
            (async () => {
                const user = await Auth.check();
                if (user) {
                    const routes = { admin: '/dashboard/admin/', docente: '/dashboard/docente/', estudiante: '/dashboard/estudiante/' };
                    window.location.href = routes[user.rol] || '/';
                }
            })();
        });
    </script>
</body>

</html>
