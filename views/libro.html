<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro Digital Interactivo | Lengua y Literatura 9º EGB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--color-background);
            display: flex;
            flex-direction: column;
        }
        
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--color-surface);
            box-shadow: var(--shadow-sm);
            z-index: 100;
            position: relative;
            flex-shrink: 0;
        }
        
        .reader-title {
            font-weight: 600;
            color: var(--color-text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pdf-toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 8px;
            background: var(--color-surface-hover);
            border-bottom: 1px solid var(--border-color);
            z-index: 90;
        }

        .page-info {
            font-weight: 500;
            color: var(--color-text);
        }

        .reader-container {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            background-color: #525659; /* Color estándar de fondo de visor PDF */
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        /* Focus Mode */
        body.focus-mode .reader-header,
        body.focus-mode .pdf-toolbar {
            display: none;
        }
        
        .pdf-canvas-wrapper {
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background: white; /* La hoja siempre debe ser blanca */
        }
        
        .floating-exit-focus {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        
        .floating-exit-focus:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        
        body.focus-mode .floating-exit-focus {
            display: flex;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--color-background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
    </style>
    <!-- Importar PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configurar el worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h4 class="color-text">Cargando Libro Digital...</h4>
        <p class="text-muted">Por favor espera, el archivo pesa 114MB.</p>
    </div>

    <header class="reader-header">
        <h1 class="reader-title">
            <span class="fs-4">📖</span>
            Biblioteca Interactiva: 9º EGB
        </h1>
        <div class="d-flex gap-3 align-items-center">
            <button id="btn-focus-mode" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-2">
                <span>🔍</span> Modo Inmersivo
            </button>
            <a href="../dashboard/estudiante/index.html" class="btn btn-secondary btn-sm">Volver al Panel</a>
        </div>
    </header>

    <div class="pdf-toolbar">
        <button id="btn-prev" class="btn btn-primary btn-sm">◀ Anterior</button>
        <span class="page-info">Página <span id="page-num"></span> de <span id="page-count"></span></span>
        <button id="btn-next" class="btn btn-primary btn-sm">Siguiente ▶</button>
        <div class="ms-3 d-flex align-items-center gap-2">
            <input type="number" id="page-input" class="form-control form-control-sm" style="width: 70px;" min="1">
            <button id="btn-go" class="btn btn-outline-secondary btn-sm">Ir</button>
        </div>
    </div>

    <button id="btn-exit-focus" class="floating-exit-focus" title="Salir del Modo Inmersivo">
        ✖
    </button>

    <main class="reader-container" id="reader-container">
        <div class="pdf-canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </main>

    <script src="../js/modules/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const url = '../LENGUA_Y_LITERATURA_9.pdf';
            const lsKey = 'libro_lengua_pagina';
            
            let pdfDoc = null,
                pageNum = 1,
                pageIsRendering = false,
                pageNumIsPending = null;

            const scale = 1.5,
                  canvas = document.getElementById('pdf-canvas'),
                  ctx = canvas.getContext('2d');

            const numSpan = document.getElementById('page-num');
            const countSpan = document.getElementById('page-count');
            const overlay = document.getElementById('loading-overlay');
            const pageInput = document.getElementById('page-input');

            // Leer página guardada
            const savedPage = localStorage.getItem(lsKey);
            if (savedPage) {
                pageNum = parseInt(savedPage, 10);
            }

            // Renderizar la página
            const renderPage = num => {
                pageIsRendering = true;

                // Obtener la página
                pdfDoc.getPage(num).then(page => {
                    const viewport = page.getViewport({ scale });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderCtx = {
                        canvasContext: ctx,
                        viewport: viewport
                    };

                    page.render(renderCtx).promise.then(() => {
                        pageIsRendering = false;
                        if (pageNumIsPending !== null) {
                            renderPage(pageNumIsPending);
                            pageNumIsPending = null;
                        }
                    });

                    // Actualizar UI
                    numSpan.textContent = num;
                    pageInput.value = num;
                    
                    // Guardar en marcador virtual (localStorage)
                    localStorage.setItem(lsKey, num);
                    
                    // Desplazar el contenedor al principio de la página
                    document.getElementById('reader-container').scrollTop = 0;
                });
            };

            // Poner en cola el renderizado si ya hay uno en proceso
            const queueRenderPage = num => {
                if (pageIsRendering) {
                    pageNumIsPending = num;
                } else {
                    renderPage(num);
                }
            };

            // Página anterior
            document.getElementById('btn-prev').addEventListener('click', () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            });

            // Página siguiente
            document.getElementById('btn-next').addEventListener('click', () => {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            });
            
            // Ir a página específica
            document.getElementById('btn-go').addEventListener('click', () => {
                const requestedPage = parseInt(pageInput.value, 10);
                if (requestedPage >= 1 && requestedPage <= pdfDoc.numPages) {
                    pageNum = requestedPage;
                    queueRenderPage(pageNum);
                } else {
                    alert(`Por favor ingresa un número entre 1 y ${pdfDoc.numPages}`);
                    pageInput.value = pageNum;
                }
            });

            // Obtener el documento PDF
            pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                countSpan.textContent = pdfDoc.numPages;
                
                // Asegurar que la página guardada no excede el total
                if (pageNum > pdfDoc.numPages) pageNum = 1;

                renderPage(pageNum);
                overlay.style.display = 'none';
            }).catch(err => {
                console.error(err);
                overlay.innerHTML = `<h4 class="text-danger">Error al cargar el libro</h4><p>${err.message}</p>`;
            });

            // ----- MODO INMERSIVO -----
            const btnFocusMode = document.getElementById('btn-focus-mode');
            const btnExitFocus = document.getElementById('btn-exit-focus');
            
            btnFocusMode.addEventListener('click', () => {
                document.body.classList.add('focus-mode');
            });
            
            btnExitFocus.addEventListener('click', () => {
                document.body.classList.remove('focus-mode');
            });
            
            // Escuchar tecla ESC y flechas de teclado para cambiar de página
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.body.classList.remove('focus-mode');
                }
                // Si el foco no está en el input, permitir navegar con flechas
                if (document.activeElement !== pageInput) {
                    if (e.key === 'ArrowLeft') {
                        document.getElementById('btn-prev').click();
                    }
                    if (e.key === 'ArrowRight') {
                        document.getElementById('btn-next').click();
                    }
                }
            });
            
            if (typeof ThemeManager !== 'undefined') {
                ThemeManager.init();
            }
        });
    </script>
</body>
</html>
